<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f2eb">
<title>Löpschema</title>
<style>
:root{
  --bg:#f8f3ed;--bg2:#fffaf5;--card:#ffffff;--ink:#211b17;--muted:#7d736b;--line:#eadfd5;
  --accent:#c45f49;--accentDark:#9f4736;--accentSoft:#f0d4cb;--soft:#f3e8df;--ok:#3f8a5c;--danger:#b64040;
  --shadow:0 8px 22px rgba(70,45,28,.07),0 1px 2px rgba(70,45,28,.06);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-tap-highlight-color:transparent;overflow:hidden;height:100dvh}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:600px;margin:0 auto;height:100dvh;overflow:hidden;position:relative;display:flex;flex-direction:column}
.top{display:none}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#efe3d9;border-radius:14px;padding:4px}
.tab{border:0;border-radius:11px;background:transparent;color:var(--muted);font-weight:750;padding:10px 12px;font-size:15px}
.tab.active{background:var(--card);color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.slider{display:flex;width:200%;transition:transform .34s cubic-bezier(.19,.8,.2,1);flex:1 1 auto;min-height:0}
.page{width:50%;padding:22px 17px 96px;overflow-y:auto;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch;height:100%}
h1{font-size:31px;line-height:1;margin:4px 0 4px;letter-spacing:-1px}
h2{margin:0;font-size:27px;letter-spacing:-.7px}
h3{margin:0 0 10px;font-size:20px}
.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.headerActions{display:flex;align-items:flex-start;gap:8px;padding-top:4px}
.headerActions{display:flex;align-items:flex-start;gap:8px;padding-top:4px}
.menuWrap{position:relative}
.menuBtn{width:38px;height:38px;border:1px solid var(--line);background:#fff;color:#6f665f;border-radius:10px;font-size:18px;line-height:1;display:grid;place-items:center;padding:0;box-shadow:0 1px 6px rgba(0,0,0,.04);font-weight:400} .menuBtn svg{display:block}
.actionMenu{position:absolute;right:0;top:46px;min-width:210px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 34px rgba(70,45,28,.14);padding:6px;display:none;z-index:40}
.actionMenu.open{display:block}
.actionItem{width:100%;text-align:left;border:0;background:transparent;color:var(--ink);border-radius:10px;padding:12px 12px;font-size:14px;font-weight:450}
.actionItem:active{background:var(--soft)}
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:var(--shadow);margin:11px 0}
.hero{background:linear-gradient(145deg,var(--accent),#d37a63);color:white;border:0;border-radius:18px;padding:18px}
.eyebrow{letter-spacing:2.8px;text-transform:uppercase;font-size:10px;font-weight:900;color:var(--muted)}
.hero .eyebrow{color:rgba(255,255,255,.72)}
.big{font-size:36px;font-weight:850;letter-spacing:-1.2px}
.btn{border:0;background:var(--accent);color:white;border-radius:11px;padding:12px 16px;font-size:14px;font-weight:500;box-shadow:none;letter-spacing:.1px}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--soft);color:var(--ink);box-shadow:none}
.btn.ghost{background:transparent;color:var(--muted);box-shadow:none}
.btn.danger{background:transparent;color:var(--danger);box-shadow:none}
.backupBox{padding-top:2px}
.backupHint{font-size:13px;color:var(--muted);line-height:1.4;font-style:italic;opacity:.85;margin:10px 0 16px}
.backupActions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 16px}
.backupActions .btn{width:100%;background:var(--soft);color:var(--ink)}
.textAction{width:100%;background:none;border:0;padding:13px 0;color:var(--muted);font-size:14px;font-weight:400;text-align:left}
.textAction.danger{color:var(--danger)}
.actionDivider{border:0;border-top:1px solid var(--line);margin:14px 0 10px}
.btn.small{padding:8px 12px;font-size:13px}
.fab{position:fixed;right:20px;bottom:22px;z-index:30;width:62px;height:62px;border-radius:50%;font-size:32px;padding:0;display:grid;place-items:center}
.quick{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;margin:0 -3px}
.quick .btn{white-space:nowrap}
.week{margin-top:22px;scroll-margin-top:88px}
.weekHead{display:flex;align-items:flex-start;justify-content:space-between;margin:0 2px 10px}
.weekTitle{font-size:18px;font-weight:800;letter-spacing:-.25px}.weekTitleRow{display:flex;align-items:baseline;gap:10px}.weekRange{color:var(--muted);font-size:12px;opacity:.75;font-weight:500}
.weekRange{color:var(--muted);font-size:12px}
.weekMeta{font-size:12px;color:var(--muted);font-weight:800}
.day{display:grid;grid-template-columns:78px 1fr 28px;gap:8px;align-items:start;margin:10px 0}
.dayName{font-weight:800;letter-spacing:1px;color:#7f746b;text-transform:uppercase;font-size:11px;padding-top:3px;display:flex;align-items:center;gap:4px;white-space:nowrap}
.dayName.today{color:var(--accent)}
.dayNum{display:inline;color:#b8aca2;font-size:11px;letter-spacing:0;margin-top:0}
.dayLine{border-top:1px solid var(--line);margin-top:12px;opacity:.7}
.plus{color:#c5bbb2;font-size:20px;font-weight:300;line-height:20px;text-align:right}
.runSwipe{grid-column:1/4;position:relative;margin:6px 0;border-radius:14px;overflow:hidden}
.deleteReveal{position:absolute;inset:0 0 0 auto;width:92px;background:var(--danger);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;opacity:0;transition:opacity .18s ease}.runSwipe.open .deleteReveal{opacity:1}
.deleteReveal button{width:100%;height:100%;border:0;background:transparent;color:#fff;font:inherit}
.run{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 13px;box-shadow:0 2px 10px rgba(70,45,28,.04);position:relative;overflow:hidden;transition:transform .2s ease;touch-action:pan-y}
.run:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--type,#ddd)}
.runTop{display:flex;justify-content:space-between;gap:10px;align-items:center}
.runDist{font-size:21px;font-weight:850;letter-spacing:-.45px}
.chip{display:inline-flex;align-items:center;border-radius:8px;background:#f6eee8;color:#755e55;padding:5px 8px;font-weight:750;margin-left:5px;font-size:11px}
.meta{color:#7c746c;font-size:13px;margin-top:2px;line-height:1.3}
.check{width:30px;height:30px;border-radius:10px;border:2px solid #d0d0cc;background:transparent;color:white;font-weight:850;flex:0 0 auto}
.done{opacity:.48}.done .runDist{text-decoration:line-through}.done .check{background:var(--ok);border-color:var(--ok)}
.empty{color:var(--muted);padding:18px;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.progressRing{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) var(--p),#ededeb 0)}
.ringInner{width:72px;height:72px;border-radius:50%;background:var(--card);display:grid;place-items:center;text-align:center;font-weight:850}
.bars{display:flex;gap:12px;align-items:end;overflow-x:auto;padding:16px 4px 7px;scroll-snap-type:x proximity}
.barWrap{min-width:58px;text-align:center;color:#9b9188;font-weight:800;scroll-snap-align:start}
.bar{height:128px;display:flex;align-items:end;justify-content:center}
.barIn{width:44px;background:#ead0c7;border-radius:8px 8px 0 0;position:relative}.barIn.now{background:var(--accent)}
.barVal{position:absolute;top:-24px;width:100%;font-size:13px;color:#958b82}
.listLine{display:flex;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);font-size:16px}
.modal{position:fixed;inset:0;z-index:50;background:rgba(25,20,16,.38);display:none;align-items:flex-end;touch-action:none;opacity:0;transition:opacity .24s ease}
.sheet{background:#fff;width:100%;max-width:600px;margin:0 auto;border-radius:20px 20px 0 0;height:100dvh;overflow:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom));box-shadow:0 -18px 48px rgba(0,0,0,.22);transition:transform .28s cubic-bezier(.2,.8,.2,1);touch-action:pan-y;transform:translateY(100%)}
.dragHandle{width:42px;height:5px;border-radius:999px;background:#d8d3ce;margin:0 auto 16px}.sheet h2{font-size:34px;line-height:1;margin:0 0 20px;letter-spacing:-1.1px}
label{display:block;margin:14px 0 6px;font-weight:900;color:#4e453e}
input,select,textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:12px 16px;font-size:14px;color:var(--ink);outline:none;box-shadow:none;min-height:43px}
select{
  appearance:none;
  -webkit-appearance:none;
  padding-right:44px;
  background-image:url("data:image/svg+xml,%3Csvg width='14' height='14' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 10l5 5 5-5' fill='none' stroke='%237d736b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 15px center;
  background-size:14px 14px;
}
input[type="date"]{
  appearance:none;
  -webkit-appearance:none;
  padding-right:44px;
  background-image:url("data:image/svg+xml,%3Csvg width='15' height='15' viewBox='0 0 24 24' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M7 3v3M17 3v3M4.5 9.5h15M6.5 5h11A2.5 2.5 0 0 1 20 7.5v10A2.5 2.5 0 0 1 17.5 20h-11A2.5 2.5 0 0 1 4 17.5v-10A2.5 2.5 0 0 1 6.5 5Z' fill='none' stroke='%237d736b' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
  background-repeat:no-repeat;
  background-position:right 15px center;
  background-size:15px 15px;
}
input[type="date"]::-webkit-calendar-picker-indicator{
  opacity:0;
  width:44px;
  height:100%;
  position:absolute;
  right:0;
  cursor:pointer;
}
input[type="date"]{
  position:relative;
}
textarea{min-height:88px;resize:vertical}
.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.actions{display:flex;gap:10px;margin-top:20px}.actions .btn{flex:1}.moveRow{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}.moveRow .btn{white-space:nowrap}
hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.goalEdit,.backupBox{display:none}.goalActions{margin-top:18px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:#171717;color:white;padding:12px 16px;border-radius:12px;z-index:80;display:none;max-width:88%;text-align:center}
.smallText{font-size:12px;color:#8f857d;line-height:1.32;font-style:italic;opacity:.8;margin-top:8px}
.typeDot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--dot)}
.installHint{font-size:13px;color:rgba(255,255,255,.75);margin-top:8px}.nextMeta{font-size:14px;font-weight:500;opacity:.82;margin-top:4px;line-height:1.35}.nextNote{font-size:14px;font-weight:400;font-style:italic;opacity:.72;margin:8px 0 0;line-height:1.35}
@media(min-width:720px){.app{border-left:1px solid var(--line);border-right:1px solid var(--line)}}
</style>
</head>
<body>
<div class="app">
  <main id="slider" class="slider">
    <section class="page" id="schemaPage">
      <div class="row" style="align-items:flex-start;">
        <div><h1>Veckoschema</h1><p class="sub" id="schemaSub"></p></div>
        <div class="headerActions">
          <button class="btn" onclick="openRun()">+ Pass</button>
          <div class="menuWrap">
            <button class="menuBtn" onclick="toggleActionMenu(event)" aria-label="Inställningar">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 7h10M18 7h2M4 17h2M10 17h10" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <circle cx="16" cy="7" r="2.3" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="8" cy="17" r="2.3" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </button>
            <div class="actionMenu" id="actionMenu">
              <button class="actionItem" onclick="togglePastWeeks();closeActionMenu()" id="pastWeeksBtn">Visa tidigare veckor</button>
            </div>
          </div>
        </div>
      </div>
      
      <div id="nextBox"></div>
      <div id="weeks"></div>
    </section>

    <section class="page">
      <h1>Planering</h1><p class="sub">Framåtblick på dina pass</p>
      <div class="card hero" id="goalCard"></div>
      <div class="card goalEdit" id="goalEdit">
        <label>Målnamn</label><input id="goalName">
        <label>Måldatum</label><input id="goalDate" type="date">
        <div class="goalActions"><button class="btn" onclick="saveGoal()">Spara mål</button></div>
      </div>
      <div id="stats"></div>
      <div class="card">
        <div class="row"><div><div class="eyebrow">Data</div><h3>Backup & återställning</h3></div><button class="btn secondary" onclick="toggleBackup()">Visa</button></div>
        <div class="backupBox" id="backupBox">
          <p class="backupHint">Exportera innan större ändringar. Import ersätter nuvarande data.</p>
          <div class="backupActions">
            <button class="btn secondary" onclick="exportData()">Exportera</button>
            <button class="btn secondary" onclick="document.getElementById('importFile').click()">Importera</button>
          </div>
          <input id="importFile" type="file" accept="application/json" style="display:none" onchange="importData(event)">
          <button class="textAction danger" onclick="clearAllData()">Rensa all data</button>
          <hr class="actionDivider">
          <button class="textAction" onclick="resetDemo()">Återställ exempeldata</button>
        </div>
      </div>
    </section>
  </main>

  
</div>

<div id="modal" class="modal" onclick="if(event.target===modal)closeRun()">
  <div class="sheet" id="sheet">
    <div class="dragHandle"></div>
    <div class="row"><h2 id="sheetTitle">Nytt pass</h2></div>
    <input type="hidden" id="runId">
    <label>Datum</label><input id="date" type="date">
    <label>Typ av pass</label><select id="type"></select>
    <div class="formGrid">
      <div><label>Distans km</label><input id="km" type="number" step=".1" inputmode="decimal"></div>
      <div><label>Tid min</label><input id="mins" type="number" inputmode="numeric"></div>
    </div>
    <label>Tempo min/km</label><input id="pace" placeholder="T.ex. 7:30" inputmode="text" autocomplete="off">
    <label>Anteckningar</label><textarea id="note" placeholder="Ex. 6 × 1000 m, lugn jogg, känsla..."></textarea>
    <div class="actions"><button class="btn" onclick="saveRun()">Spara</button></div>
    <div style="display:flex;justify-content:center;margin-top:8px"><button id="deleteBtn" class="btn danger" style="flex:none" onclick="deleteRun()">Ta bort pass</button></div>
    <div id="moveBlock">
      <hr><h3>Flytta detta och kommande pass</h3>
      <p class="smallText">Välj nytt datum för detta pass. Alla pass från detta datum och framåt flyttas lika många dagar.</p>
      <div class="moveRow">
        <input id="moveDate" type="date">
        <button class="btn secondary" onclick="moveFuture()">Flytta</button>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
const TYPES=["Distanspass","Intervaller","Tröskelpass","Långpass","Återhämtning","Tävling","Backpass"];
const TYPE_COLORS={"Distanspass":"#c45f49","Intervaller":"#7b6fd0","Tröskelpass":"#d28a3d","Långpass":"#2f7b68","Återhämtning":"#7aa0a8","Tävling":"#b64040","Backpass":"#8a6847"};
const KEY="runplanner.v4";
let state=load(); let showPastWeeks=false;
let view=0,startX=0,lastEdited=null;

function demoState(){
  const today=new Date(); const base=startOfWeek(today); const runs=[];
  const pattern=[
    [0,"Återhämtning",5,32,"Lätt jogg + rörlighet"],
    [2,"Distanspass",8,45,"Kontrollerat och avslappnat"],
    [4,"Intervaller",10,56,"5 × 1000 m, 90 s vila"],
    [6,"Långpass",16,98,"Lugn fart"],
    [9,"Tröskelpass",11,62,"3 × 10 min tröskel"],
    [11,"Distanspass",8,46,"Stabilt distanspass"],
    [13,"Långpass",18,112,"Vätska efter 60 min"],
    [16,"Återhämtning",6,38,"Kort och lätt"],
    [18,"Intervaller",12,70,"8 × 800 m"],
    [20,"Långpass",21,132,"Progressivt sista 5 km"],
    [23,"Distanspass",9,52,"Mjukt underlag"],
    [25,"Backpass",10,63,"10 × 45 s backe"],
    [27,"Långpass",24,154,"Lugn långtur"],
    [30,"Tröskelpass",12,67,"2 × 20 min"],
    [32,"Återhämtning",6,37,"Mycket lätt"],
    [34,"Långpass",27,174,"Testa energi"],
    [37,"Distanspass",10,57,"Jämn fart"],
    [39,"Intervaller",13,75,"6 × 1200 m"],
    [41,"Långpass",30,195,"Sista stora långpasset"],
    [44,"Återhämtning",6,36,"Nedtrappning"],
    [46,"Distanspass",8,45,"Lätt och piggt"],
    [48,"Tävling",42.2,240,"Måldag"]
  ];
  pattern.forEach((p,i)=>{let d=addDays(base,p[0]);runs.push({id:Date.now()+i+Math.random(),date:iso(d),type:p[1],distansKm:p[2],tidMinuter:p[3],tempoPerKm:paceFrom(p[2],p[3]),anteckning:p[4],genomfort:i<3});});
  return {goal:{name:"Stockholm Marathon",date:iso(addDays(base,48))},runs};
}
function load(){const saved=localStorage.getItem(KEY); if(saved) return JSON.parse(saved); return demoState();}
function persist(){localStorage.setItem(KEY,JSON.stringify(state));render();}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function addDays(d,n){let x=new Date(d);x.setDate(x.getDate()+n);return x}
function parse(d){let [y,m,da]=d.split("-").map(Number);return new Date(y,m-1,da)}
function startOfWeek(d){let x=new Date(d);let day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}
function startOfDay(d){let x=new Date(d);x.setHours(0,0,0,0);return x}
function weekNo(d){d=typeof d==="string"?parse(d):new Date(d);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-(d.getDay()+6)%7);let w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+(w1.getDay()+6)%7)/7)}
function fmtDate(s){return parse(s).toLocaleDateString("sv-SE",{day:"numeric",month:"long"})}
function shortDate(s){return parse(s).toLocaleDateString("sv-SE",{day:"numeric",month:"short"})}
function weekday(d){return ["MÅN","TIS","ONS","TORS","FRE","LÖR","SÖN"][(d.getDay()+6)%7]}
function paceFrom(km,min){if(!km||!min)return"";let p=min/km,m=Math.floor(p),sec=Math.round((p-m)*60);if(sec===60){m++;sec=0}return m+":"+String(sec).padStart(2,"0")}

function formatDuration(mins){
  mins=Number(mins||0);
  if(mins<60) return `${mins} min`;
  const h=Math.floor(mins/60);
  const m=mins%60;
  if(m===0) return `${h} h`;
  return `${h} h ${String(m).padStart(2,"0")} min`;
}

function minsFrom(km,pace){let p=parsePace(pace);return km&&p?Math.round(km*p):0}
function parsePace(p){if(!p)return 0;let [m,s="0"]=String(p).trim().replace(",",":").replace(".",":").replace(";",":").split(":");return Number(m)+Number(s)/60}
function sum(a,k){return a.reduce((s,r)=>s+Number(r[k]||0),0)}
function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]))}

function go(i){view=i;slider.style.transform=`translateX(-${i*50}%)`}
document.addEventListener("touchstart",e=>startX=e.touches[0].clientX,{passive:true});
document.addEventListener("touchend",e=>{
  if(modal.style.display==="flex")return;
  if(e.target.closest(".runSwipe"))return;
  let dx=e.changedTouches[0].clientX-startX;
  if(Math.abs(dx)>70)go(dx<0?1:0);
},{passive:true});

function toggleActionMenu(event){
  event.stopPropagation();
  actionMenu.classList.toggle("open");
}
function closeActionMenu(){
  actionMenu.classList.remove("open");
}
document.addEventListener("click",e=>{
  if(!e.target.closest(".menuWrap")) closeActionMenu();
});
function togglePastWeeks(){
  showPastWeeks=!showPastWeeks;
  render();
}
function render(){
  type.innerHTML=TYPES.map(t=>`<option>${t}</option>`).join("");
  state.runs.sort((a,b)=>a.date.localeCompare(b.date));
  renderSchema(); renderStats();
}
function relativeDateText(dateString){
  const today=startOfDay(new Date());
  const target=parse(dateString);
  const diff=Math.round((target-today)/86400000);
  if(diff===0) return "Idag";
  if(diff===1) return "Imorgon";
  if(diff>1) return `Om ${diff} dagar`;
  if(diff===-1) return "Igår";
  return `${Math.abs(diff)} dagar sedan`;
}
function renderSchema(){
  const all=state.runs;
  const today=startOfDay(new Date());
  const next=all.find(r=>!r.genomfort && parse(r.date)>=today) || all.find(r=>!r.genomfort);
  schemaSub.textContent=`${all.length} pass · ${sum(all,'distansKm').toFixed(0)} km totalt`;
  nextBox.innerHTML=next?`<div class="card hero" onclick="editRun(${next.id})"><div class="eyebrow">${relativeDateText(next.date)}</div><div class="big">${next.distansKm} km</div><div class="nextMeta">${next.type} · ${formatDuration(next.tidMinuter)} · ${next.tempoPerKm}/km</div>${next.anteckning?`<div class="nextNote">${esc(next.anteckning)}</div>`:""}</div>`:`<div class="card empty">Inga kommande pass.</div>`;
  let currentWeek=startOfWeek(today);
  let minDate=showPastWeeks
    ? (all[0]?startOfWeek(parse(all[0].date)):currentWeek)
    : currentWeek;

  let maxDate=all[all.length-1]?startOfWeek(parse(all[all.length-1].date)):addDays(currentWeek,42);
  maxDate=addDays(maxDate,21);

  const btn=document.getElementById('pastWeeksBtn');
  if(btn){
    btn.textContent=showPastWeeks ? 'Dölj tidigare veckor' : 'Visa tidigare veckor';
  }
  let html="";
  for(let w=new Date(minDate);w<=maxDate;w=addDays(w,7)){
    let days=[0,1,2,3,4,5,6].map(n=>addDays(w,n));
    let weekRuns=all.filter(r=>parse(r.date)>=days[0]&&parse(r.date)<=days[6]);
    let weekKm=sum(weekRuns,"distansKm");
    html+=`<div class="week" id="week-${iso(w)}"><div class="weekHead"><div><div class="weekTitleRow"><div class="weekTitle">Vecka ${weekNo(w)}</div><div class="weekRange">${shortDate(iso(days[0]))}–${shortDate(iso(days[6]))}</div></div></div><div class="weekMeta">${weekRuns.length} pass<br>${weekKm.toFixed(0)} km</div></div>`;
    days.forEach(d=>{
      let ds=iso(d),rs=all.filter(r=>r.date===ds),isToday=ds===iso(today);
      html+=`<div class="day"><div class="dayName ${isToday?'today':''}">${weekday(d)}<span class="dayNum">${d.getDate()}</span></div><div class="dayLine"></div><div class="plus" onclick="openRun('${ds}')">+</div>`;
      if(rs.length){rs.forEach(r=>html+=runCard(r));}
      html+=`</div>`;
    });
    html+=`</div>`;
  }
  weeks.innerHTML=html;
}
function runCard(r){
  const color=TYPE_COLORS[r.type]||"#bbb";
  return `<div class="runSwipe" data-id="${r.id}">
    <div class="deleteReveal"><button onclick="event.stopPropagation();quickDeleteRun(${r.id})">Ta bort</button></div>
    <div class="run ${r.genomfort?'done':''}" data-run-id="${r.id}" style="--type:${color}" onclick="editRun(${r.id})">
      <div class="runTop"><div><span class="runDist">${r.distansKm} km</span></div><button class="check" onclick="event.stopPropagation();toggleDone(${r.id})">✓</button></div>
      <div class="meta">${r.type} · ${formatDuration(r.tidMinuter)} · ${r.tempoPerKm}/km</div>
      ${r.anteckning?`<div class="smallText">${esc(r.anteckning)}</div>`:""}
    </div>
  </div>`;
}
function renderStats(){
  const today=startOfDay(new Date());
  const runs=state.runs;
  const upcoming=runs.filter(r=>!r.genomfort && parse(r.date)>=today);
  const future=upcoming.length ? upcoming : runs.filter(r=>!r.genomfort);
  const hasGoal=state.goal&&state.goal.name&&state.goal.date;
  const days=hasGoal?Math.max(0,Math.ceil((parse(state.goal.date)-today)/86400000)):null;
  goalCard.innerHTML=hasGoal
    ? `<div class="eyebrow">◎ Mål</div><div class="big" style="font-size:35px">${esc(state.goal.name)}</div><div style="font-size:21px">${fmtDate(state.goal.date)}</div><div class="row" style="margin-top:22px"><div class="big" style="font-size:34px">${days} d kvar</div><button class="btn secondary" onclick="toggleGoal()">Ändra</button></div>`
    : `<div class="eyebrow">◎ Mål</div><div class="big" style="font-size:35px">Inget mål valt</div><div class="nextMeta" style="opacity:.78;margin-top:8px">Lägg till ett lopp eller mål att träna mot.</div><div class="row" style="margin-top:22px"><button class="btn secondary" onclick="toggleGoal()">Lägg till mål</button></div>`;
  goalName.value=state.goal.name||"";goalDate.value=state.goal.date||"";

  let weekKm={};
  future.forEach(r=>{let key=iso(startOfWeek(parse(r.date)));weekKm[key]=(weekKm[key]||0)+Number(r.distansKm||0)});
  let entries=Object.entries(weekKm).sort();
  let max=Math.max(20,...entries.map(e=>e[1]));
  let bars=entries.map(([k,v],i)=>{
    return `<div class="barWrap"><div class="bar"><div class="barIn ${i===0?'now':''}" style="height:${Math.max(10,v/max*116)}px"><span class="barVal">${Math.round(v)}</span></div></div><div>${i===0?'Nästa':shortDate(k)}</div></div>`
  }).join("");

  let types={};
  future.forEach(r=>types[r.type]=(types[r.type]||0)+1);

  const next=future[0];
  stats.innerHTML=`
    <div class="card">
      <div class="eyebrow">Planerat framåt</div>
      <div class="big" style="font-size:35px">${future.length}</div>
      <div class="sub">kommande pass${next?` · nästa ${fmtDate(next.date)}`:""}</div>
    </div>
    <div class="grid2">
      <div class="card"><div class="eyebrow">Planerat</div><div class="big">${sum(future,'distansKm').toFixed(0)}</div><div class="sub">km framåt</div></div>
      <div class="card"><div class="eyebrow">Tid</div><div class="big">${(sum(future,'tidMinuter')/60).toFixed(1)}</div><div class="sub">timmar framåt</div></div>
    </div>
    <div class="card"><div class="eyebrow">Planerad volym per vecka</div><div class="bars">${bars||"<p class='empty'>Inga kommande pass.</p>"}</div></div>
    <div class="card"><div class="eyebrow">Kommande passtyper</div>${Object.entries(types).map(([k,v])=>`<div class="listLine"><span><span class="typeDot" style="--dot:${TYPE_COLORS[k]||'#bbb'}"></span><b>${k}</b></span><span>${v} pass</span></div>`).join("")||"<p class='empty'>Inga kommande pass.</p>"}</div>`;
}

function showModal(){
  modal.style.display="flex";
  modal.style.opacity="0";
  sheet.style.transition="none";
  sheet.style.transform="translateY(100%)";
  requestAnimationFrame(()=>{
    modal.style.opacity="1";
    sheet.style.transition="transform .28s cubic-bezier(.2,.8,.2,1)";
    sheet.style.transform="translateY(0)";
  });
}
function openRun(ds=""){lastEdited=null;sheetTitle.textContent="Nytt pass";runId.value="";date.value=ds||iso(new Date());type.value=TYPES[0];km.value="";mins.value="";pace.value="";note.value="";moveBlock.style.display="none";deleteBtn.style.display="none";showModal();setTimeout(()=>date.focus(),100)}
function editRun(id){let r=state.runs.find(x=>x.id===id);lastEdited=r;sheetTitle.textContent="Ändra pass";runId.value=r.id;date.value=r.date;type.value=r.type;km.value=r.distansKm;mins.value=r.tidMinuter;pace.value=r.tempoPerKm;note.value=r.anteckning;moveDate.value=r.date;moveBlock.style.display="block";deleteBtn.style.display="block";showModal()}
function closeRun(){
  sheet.style.transform="translateY(100%)";
  modal.style.opacity="0";
  setTimeout(()=>{modal.style.display="none";sheet.style.transform="translateY(100%)"},240);
}
function toggleDone(id){let r=state.runs.find(x=>x.id===id);r.genomfort=!r.genomfort;persist()}
function saveRun(){
  if(!date.value){toastMsg("Välj datum");return}
  const obj={date:date.value,type:type.value,distansKm:Number(km.value||0),tidMinuter:Number(mins.value||0),tempoPerKm:pace.value||paceFrom(Number(km.value),Number(mins.value)),anteckning:note.value,genomfort:lastEdited?lastEdited.genomfort:false};
  if(runId.value){Object.assign(state.runs.find(r=>r.id==runId.value),obj)}else{state.runs.push({...obj,id:Date.now()+Math.random()})}
  closeRun();persist();toastMsg("Sparat")
}
function deleteRun(){if(!runId.value)return; if(confirm("Ta bort passet?")){state.runs=state.runs.filter(r=>r.id!=runId.value);closeRun();persist();toastMsg("Pass borttaget")}}
function quickDeleteRun(id){
  if(confirm("Ta bort passet?")){
    state.runs=state.runs.filter(r=>r.id!=id);
    persist();
    toastMsg("Pass borttaget");
  }
}
function moveFuture(){
  const r=state.runs.find(x=>x.id==runId.value); if(!r||!moveDate.value)return;
  const old=parse(r.date),nu=parse(moveDate.value); const diff=Math.round((nu-old)/86400000);
  if(diff===0){toastMsg("Samma datum valt");return}
  const affected=state.runs.filter(x=>parse(x.date)>=old);
  const text=diff>0?`${diff} dagar framåt`:`${Math.abs(diff)} dagar bakåt`;
  if(!confirm(`Detta flyttar ${affected.length} pass ${text}. Fortsätt?`))return;
  affected.forEach(x=>x.date=iso(addDays(parse(x.date),diff)));
  closeRun();persist();toastMsg(`Flyttade ${affected.length} pass`)
}
let updating=false;
function recalc(source){
  if(updating)return;updating=true;
  const d=Number(km.value||0),t=Number(mins.value||0),p=parsePace(pace.value);
  if((source==="km"||source==="mins")&&d&&t) pace.value=paceFrom(d,t);
  if(source==="pace"&&d&&p) mins.value=minsFrom(d,pace.value);
  if(source==="km"&&d&&p&&!t) mins.value=minsFrom(d,pace.value);
  updating=false;
}
km.addEventListener("input",()=>recalc("km"));mins.addEventListener("input",()=>recalc("mins"));pace.addEventListener("input",()=>recalc("pace"));

function scrollToday(){
  let el=document.getElementById("week-"+iso(startOfWeek(new Date())));
  if(el){
    const page=document.getElementById("schemaPage");
    page.scrollTo({top:el.offsetTop-12,behavior:"smooth"});
  }
}
function copyCurrentWeek(){
  const w=startOfWeek(new Date()); const next=addDays(w,7);
  const weekRuns=state.runs.filter(r=>parse(r.date)>=w&&parse(r.date)<next);
  if(!weekRuns.length){toastMsg("Inga pass denna vecka");return}
  if(!confirm(`Kopiera ${weekRuns.length} pass från denna vecka till nästa?`))return;
  weekRuns.forEach(r=>state.runs.push({...r,id:Date.now()+Math.random(),date:iso(addDays(parse(r.date),7)),genomfort:false}));
  persist();toastMsg("Vecka kopierad")
}
function toggleGoal(){goalEdit.style.display=goalEdit.style.display==="block"?"none":"block"}
function saveGoal(){state.goal={name:goalName.value.trim(),date:goalDate.value};goalEdit.style.display="none";persist();toastMsg("Mål sparat")}
function toggleBackup(){backupBox.style.display=backupBox.style.display==="block"?"none":"block"}
function exportData(){
  const blob=new Blob([JSON.stringify(state,null,2)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="lopschema-backup.json";a.click();URL.revokeObjectURL(a.href)
}
function importData(e){
  const f=e.target.files[0]; if(!f)return;
  const reader=new FileReader();
  reader.onload=()=>{try{const data=JSON.parse(reader.result);if(!data.runs||!data.goal)throw Error(); if(confirm("Importera och ersätt nuvarande data?")){state=data;persist();toastMsg("Importerad")}}catch{toastMsg("Kunde inte läsa filen")}};
  reader.readAsText(f); e.target.value="";
}
function clearAllData(){
  if(!confirm("Ta bort all träningsdata? Detta går inte att ångra.")) return;
  state={
    goal:{name:"",date:""},
    runs:[]
  };
  persist();
  toastMsg("All data raderad");
}
function resetDemo(){if(confirm("Återställ exempeldata? Nuvarande data skrivs över.")){state=demoState();persist();toastMsg("Återställt")}}
function toastMsg(t){toast.textContent=t;toast.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.style.display="none",1900)}


let swipeItem=null,swipeStartX=0,swipeStartY=0,swipeDX=0,swipeOpenId=null;
document.addEventListener("touchstart",e=>{
  const run=e.target.closest(".run");
  if(!run || modal.style.display==="flex")return;
  swipeItem=run;
  swipeStartX=e.touches[0].clientX;
  swipeStartY=e.touches[0].clientY;
  swipeDX=0;
},{passive:true});
document.addEventListener("touchmove",e=>{
  if(!swipeItem)return;
  const dx=e.touches[0].clientX-swipeStartX;
  const dy=e.touches[0].clientY-swipeStartY;
  if(Math.abs(dy)>Math.abs(dx))return;
  if(dx<0){
    swipeDX=Math.max(dx,-92);
    swipeItem.style.transform=`translateX(${swipeDX}px)`;
    e.preventDefault();
  }else if(dx>0 && swipeOpenId && swipeItem.dataset.runId==swipeOpenId){
    swipeDX=Math.min(-92+dx,0);
    swipeItem.style.transform=`translateX(${swipeDX}px)`;
    e.preventDefault();
  }
},{passive:false});
document.addEventListener("touchend",()=>{
  if(!swipeItem)return;
  const id=swipeItem.dataset.runId;
  document.querySelectorAll(".run").forEach(el=>{
    if(el!==swipeItem)el.style.transform="translateX(0)";
  });
  document.querySelectorAll(".runSwipe").forEach(w=>{
    if(w.dataset.id!==id)w.classList.remove("open");
  });
  if(swipeDX<-45){
    swipeItem.style.transform="translateX(-92px)";
    swipeItem.closest(".runSwipe").classList.add("open");
    swipeOpenId=id;
  }else{
    swipeItem.style.transform="translateX(0)";
    swipeItem.closest(".runSwipe").classList.remove("open");
    if(swipeOpenId===id)swipeOpenId=null;
  }
  swipeItem=null;
  swipeDX=0;
},{passive:true});
document.addEventListener("click",e=>{
  if(!e.target.closest(".runSwipe")){
    document.querySelectorAll(".run").forEach(el=>el.style.transform="translateX(0)");
    document.querySelectorAll(".runSwipe").forEach(w=>w.classList.remove("open"));
    swipeOpenId=null;
  }
});

let modalStartY=0,modalCurrentY=0,modalDragging=false;
sheet.addEventListener("touchstart",e=>{
  if(modal.style.display!=="flex")return;
  modalStartY=e.touches[0].clientY;
  modalCurrentY=0;
  modalDragging=sheet.scrollTop<=0;
},{passive:true});
sheet.addEventListener("touchmove",e=>{
  if(modal.style.display!=="flex")return;
  const dy=e.touches[0].clientY-modalStartY;
  if(dy>0 && sheet.scrollTop<=0){
    modalDragging=true;
    modalCurrentY=dy;
    sheet.style.transition="none";
    sheet.style.transform=`translateY(${dy}px)`;
    e.preventDefault();
  }
},{passive:false});
sheet.addEventListener("touchend",()=>{
  if(!modalDragging)return;
  sheet.style.transition="transform .22s ease";
  if(modalCurrentY>110){
    closeRun();
  }else{
    sheet.style.transform="translateY(0)";
  }
  modalDragging=false;
  modalCurrentY=0;
},{passive:true});

render();
</script>
</body>
</html>
