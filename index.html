<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Löpschema</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f7f4ef;color:#2f2723}
.header{padding:20px;font-size:36px;font-weight:700}
.tabs{display:flex;position:sticky;top:0;background:#f7f4ef}
.tab{flex:1;padding:14px;border:none;background:none;font-size:16px}
.active{border-bottom:3px solid #c46049}
.page{padding:16px}
.card{background:white;border-radius:20px;padding:16px;margin-bottom:16px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.primary{background:#c46049;color:white}
.run{padding:12px;border-radius:14px;background:white;margin:8px 0}
.done{opacity:.5;text-decoration:line-through}
button{background:#c46049;color:white;border:none;border-radius:12px;padding:10px 14px}
input,select,textarea{width:100%;padding:10px;margin:6px 0;box-sizing:border-box}
.hidden{display:none}
</style>
</head>
<body>
<div class="header">Löpschema</div>
<div class="tabs">
<button class="tab active" onclick="showPage('schema',this)">Schema</button>
<button class="tab" onclick="showPage('stats',this)">Statistik</button>
</div>

<div id="schema" class="page">
<div id="nextRun"></div>

<div class="card">
<h3>Nytt pass</h3>
<input type="date" id="date">
<select id="type">
<option>Distanspass</option>
<option>Intervaller</option>
<option>Tröskelpass</option>
<option>Långpass</option>
<option>Återhämtning</option>
<option>Tävling</option>
</select>
<input type="number" id="km" placeholder="Distans km">
<input type="number" id="min" placeholder="Tid minuter">
<textarea id="note" placeholder="Anteckning"></textarea>
<button onclick="addRun()">Lägg till pass</button>
</div>

<div id="runs"></div>
</div>

<div id="stats" class="page hidden">
<div class="card">
<h2>Mål</h2>
<input id="goalName" placeholder="Målnamn">
<input id="goalDate" type="date">
<button onclick="saveGoal()">Spara mål</button>
</div>
<div class="card" id="statsBox"></div>
</div>

<script>
let runs=JSON.parse(localStorage.getItem('runs')||'[]');
let goal=JSON.parse(localStorage.getItem('goal')||'{"name":"Stockholm Marathon","date":"2026-06-01"}');

if(runs.length===0){
runs=[
{id:1,date:"2026-06-01",type:"Distanspass",km:8,min:45,note:"",done:false},
{id:2,date:"2026-06-04",type:"Intervaller",km:10,min:55,note:"",done:false},
{id:3,date:"2026-06-07",type:"Långpass",km:18,min:110,note:"",done:false}
];
save();
}

function save(){
localStorage.setItem('runs',JSON.stringify(runs));
localStorage.setItem('goal',JSON.stringify(goal));
render();
}

function addRun(){
runs.push({
id:Date.now(),
date:date.value,
type:type.value,
km:Number(km.value||0),
min:Number(min.value||0),
note:note.value,
done:false
});
save();
}

function toggle(id){
let r=runs.find(x=>x.id===id);
r.done=!r.done;
save();
}

function removeRun(id){
runs=runs.filter(x=>x.id!==id);
save();
}

function render(){
runs.sort((a,b)=>a.date.localeCompare(b.date));

const future=runs.filter(r=>!r.done);
const next=future[0];

nextRun.innerHTML=next?`
<div class="card primary">
<h3>Nästa pass</h3>
<div><b>${next.type}</b></div>
<div>${next.km} km • ${next.min} min</div>
<div>${next.date}</div>
</div>`:"";

runsDiv='';
runs.forEach(r=>{
runsDiv+=`
<div class="run ${r.done?'done':''}">
<b>${r.type}</b><br>
${r.date}<br>
${r.km} km • ${r.min} min<br>
<button onclick="toggle(${r.id})">${r.done?'Ångra':'Klar'}</button>
<button onclick="removeRun(${r.id})">Ta bort</button>
</div>`;
});
document.getElementById('runs').innerHTML=runsDiv;

goalName.value=goal.name;
goalDate.value=goal.date;

const done=runs.filter(r=>r.done).length;
const left=runs.length-done;
const kmDone=runs.filter(r=>r.done).reduce((a,b)=>a+b.km,0);
const kmLeft=runs.filter(r=>!r.done).reduce((a,b)=>a+b.km,0);

statsBox.innerHTML=`
<p><b>${goal.name}</b></p>
<p>Måldatum: ${goal.date}</p>
<p>Genomförda pass: ${done}</p>
<p>Kvarvarande pass: ${left}</p>
<p>Avklarade km: ${kmDone}</p>
<p>Kvarvarande km: ${kmLeft}</p>`;
}

function saveGoal(){
goal={name:goalName.value,date:goalDate.value};
save();
}

function showPage(id,btn){
document.querySelectorAll('.page').forEach(x=>x.classList.add('hidden'));
document.getElementById(id).classList.remove('hidden');
document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
btn.classList.add('active');
}

render();
</script>
</body>
</html>
